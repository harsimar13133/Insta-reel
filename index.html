<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reel Player</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #1e1e24 0%, #0d0e12 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      overflow: hidden;
    }

    /* Player Container */
    .player-card {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7),
                  0 0 35px rgba(225, 48, 108, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Video Player */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    /* Play/Pause Overlay Indicator */
    .play-overlay {
      position: absolute;
      width: 70px;
      height: 70px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .play-overlay::before {
      content: '';
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 12px 0 12px 20px;
      border-color: transparent transparent transparent #fff;
      margin-left: 4px;
    }

    .play-overlay.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Responsive scaling for shorter screens */
    @media (max-height: 720px) {
      .player-card {
        max-width: 320px;
      }
    }
  </style>
</head>
<body>

  <div class="player-card">
    <video id="reelVideo" src="reel.mp4" loop playsinline autoplay muted controls></video>
    <div class="play-overlay" id="playOverlay"></div>
  </div>

  <!-- Video Interaction JS -->
  <script>
    const video = document.getElementById('reelVideo');
    const overlay = document.getElementById('playOverlay');

    // Click anywhere on video to toggle Play / Pause
    video.addEventListener('click', () => {
      if (video.paused) {
        video.play();
        showOverlay();
      } else {
        video.pause();
        showOverlay();
      }
    });

    function showOverlay() {
      overlay.classList.add('active');
      setTimeout(() => {
        overlay.classList.remove('active');
      }, 500);
    }
  </script>

  <!-- Firebase Logging Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // 1. Replace with your actual Firebase project config credentials
    const firebaseConfig = {
  apiKey: "AIzaSyCOUw0y3GEpASBi5i3cHMMEsAI1otVUgro",
  authDomain: "checking-live.firebaseapp.com",
  projectId: "checking-live",
  storageBucket: "checking-live.firebasestorage.app",
  messagingSenderId: "248781570983",
  appId: "1:248781570983:web:8880dc6cede919648a2c82"
};

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Function to record page visit exact timestamp
    function recordVisit() {
      const now = new Date();

      // Formatting hours, minutes, seconds with leading zeros
      const pad = (num) => String(num).padStart(2, '0');
      const hours = pad(now.getHours());
      const minutes = pad(now.getMinutes());
      const seconds = pad(now.getSeconds());

      const formattedTime = `${hours}:${minutes}:${seconds}`;
      const formattedDate = now.toISOString().split('T')[0]; // "YYYY-MM-DD"

      const logData = {
        date: formattedDate,
        time: formattedTime,
        hours: now.getHours(),
        minutes: now.getMinutes(),
        seconds: now.getSeconds(),
        fullTimestamp: now.toLocaleString(),
        serverTimestamp: serverTimestamp()
      };

      // Push log entry to "visits" node in Firebase Database
      const visitsRef = ref(database, 'visits');
      push(visitsRef, logData)
        .then(() => {
          console.log("Visit logged successfully at:", formattedDate, formattedTime);
        })
        .catch((error) => {
          console.error("Firebase logging failed:", error);
        });
    }

    // Trigger on page load
    window.addEventListener('DOMContentLoaded', recordVisit);
  </script>

</body>
</html>
